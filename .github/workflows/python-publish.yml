# Publishes the Kuckuck wheel + sdist to PyPI on GitHub releases tagged `v*`.
#
# Prerequisites (one-time, done outside this repo):
#   1. A GitHub environment named `release` exists on Hochfrequenz/kuckuck
#      (Repo Settings -> Environments -> New environment).
#   2. PyPI has a Trusted Publisher registered for this workflow:
#      Owner  = Hochfrequenz
#      Repo   = kuckuck
#      Workflow file = python-publish.yml
#      Environment   = release
#      Register at https://pypi.org/manage/account/publishing/
#
# When a release tagged `v<version>` is created on GitHub:
#   - The `tests` job re-runs the full test suite on the tagged commit.
#   - The `build-n-publish` job builds wheel + sdist and uploads to PyPI
#     via OIDC (no API token needed thanks to the trusted publisher).

name: Upload Python Package

on:
  release:
    # 'published' fires once per release; 'created' / 'edited' would
    # double-trigger on draft + publish or on metadata edits and try
    # to re-upload the same version (PyPI rejects, but it is CI noise).
    types: [published]

jobs:
  tests:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: Run the Unit Tests
        run: uv run --group tests --extra cli --extra mcp pytest
      - name: Run Linting
        run: |
          uv run --group linting --extra cli --extra mcp pylint kuckuck
          uv run --group linting --extra cli --extra mcp pylint unittests --rcfile=unittests/.pylintrc
      - name: Run Type Check
        run: |
          uv run --group type_check --extra cli --extra mcp mypy --show-error-codes src/kuckuck --strict
          uv run --group type_check --extra cli --extra mcp mypy --show-error-codes unittests --strict
      - name: Run Coverage
        working-directory: unittests
        run: |
          uv run --group coverage --extra cli --extra mcp coverage run -m pytest
          uv run --group coverage coverage report --fail-under 80 --omit unittests/*

  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    # Required by PyPI trusted publishing:
    # https://docs.pypi.org/trusted-publishers/adding-a-publisher/
    environment: release
    permissions:
      # Mandatory for trusted publishing via OIDC.
      id-token: write
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: Build wheel and source distribution
        run: |
          uv build
      - name: Publish distribution to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv publish --trusted-publishing=automatic
