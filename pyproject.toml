[project]
name = "kuckuck"
description = "Lokale Pseudonymisierung personenbezogener Daten in Textdateien vor der Verarbeitung durch Cloud-LLMs"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+github@hochfrequenz.de" }]
keywords = ["pseudonymization", "pii", "gdpr", "dsgvo", "llm", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Text Processing",
]
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "python-dotenv>=1.1",
    "cryptography>=44",
    "phonenumbers>=8.13",
    "pyahocorasick>=2.1",
    "email-validator>=2.2",
    # Format-aware preprocessors. Lower bounds chosen to track the
    # minimum versions actually exercised by the test suite. We avoid
    # upper bounds to stay flexible for dependency-update bots; the
    # surface we use is small and stable in each library.
    "extract-msg>=0.52",
    "markdown-it-py>=3",
    "lxml>=5",
    "selectolax>=0.3",
]
dynamic = ["readme", "version"]

[project.optional-dependencies]
cli = [
    "typer>=0.15"
]
# GLiNER-based PERSON detector. Opt-in: pulls torch (~ 250 MB CPU-only,
# ~ 3 GB GPU-default) and requires the model snapshot fetched via
# 'kuckuck fetch-model' before use. onnxruntime is imported unconditionally
# by gliner.model, so it is part of the runtime dependency set even when we
# load weights from PyTorch (.bin / .safetensors).
ner = [
    "gliner>=0.2.20",
    "huggingface-hub>=0.20",
    "onnxruntime>=1.18"
]
mcp = [
    "fastmcp>=3"
]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/kuckuck/releases"
Homepage = "https://github.com/Hochfrequenz/kuckuck"

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "syrupy==5.5.3",
    "hypothesis==6.165.9"
]
lint = [
    "ruff==0.16.2"
]
# mypy --strict also runs against unittests/.
type_check = [
    "mypy==2.3.0",
    {include-group = "tests"}
]
spell_check = [
    "codespell==2.4.3"
]
# coverage runs the pytest suite under measurement.
coverage = [
    "coverage==7.15.4",
    {include-group = "tests"}
]
build_executable = [
    "pyinstaller==6.21.0"
]
dev = [
    {include-group = "tests"},
    {include-group = "lint"},
    {include-group = "type_check"},
    {include-group = "coverage"},
    {include-group = "spell_check"}
]

[tool.uv]
default-groups = []

[project.scripts]
kuckuck = "kuckuck.__main__:main"
kuckuck-mcp = "kuckuck_mcp.server:main"

[tool.ruff]
line-length = 120
# Matches requires-python's floor. Ruff already infers this from requires-python
# when unset; set explicitly so it's visible without cross-referencing [project].
target-version = "py311"
# ruff format also reformats fenced Python code blocks in Markdown; black/isort never touched docs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913",  # too-many-arguments
    "PLR0917",  # too-many-positional-arguments
    "PLR0912",  # too-many-branches
    "PLR0914",  # too-many-locals - was pylint-disabled at several call sites before this migration
    "PLR0915",  # too-many-statements
    "PLR2004",  # magic-value-comparison
    # import-outside-toplevel: lazy-loads heavy optional deps (torch, gliner,
    # onnxruntime, ...) and avoids circular imports; pylint-disabled at ~19
    # call sites across src/ and unittests/ before this migration.
    "PLC0415",
    # German punctuation (guillemets, curly quotes, ellipses) in domain text, not typos.
    "RUF001",
    "RUF002",
    "RUF003",
]
# ruff has no equivalent to pylint's type-inference-based checks (no-member,
# c-extension-no-member) or its duplicate-code/too-few-public-methods
# checks - those were disabled repo-wide in the old [tool.pylint."MESSAGES
# CONTROL"] and simply have no ruff rule to carry the disable forward to.

[tool.ruff.lint.per-file-ignores]
# typer.Option()/typer.Argument() as parameter defaults is the standard typer
# idiom; pylint's dangerous-default-value check never covered arbitrary calls.
"src/kuckuck/__main__.py" = ["B008"]
# Sequential validate-and-return-early checks; pylint-disabled here before this migration.
"unittests/smoke_test_exe.py" = ["PLR0911"]
"unittests/smoke_test_exe_ner.py" = ["PLR0911"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "snapshot: mark a test as a snapshot test",
    "ner: integration tests that load the real GLiNER model (slow, opt-in via -m ner)"
]
# NER integration tests are deselected by default. CI opts in by adding
# `-m "ner"` to the pytest invocation in the dedicated NER job.
addopts = "-m 'not ner'"

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_kuckuck_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
